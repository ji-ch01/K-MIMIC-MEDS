# @package _global_
# meds-torch 0.0.8 training config — MIMIC-IV benchmark (Lane A).
# Mirrors kmimic_train.yaml's proven-working structure (same defaults groups,
# same paths/data/model key layout) — scaled up for MIMIC's size and run on GPU.
#
# Run from the repo root:
#   meds-torch-train \
#     --config-dir experiments/lane_a/configs \
#     --config-name mimic_train \
#     'hydra.searchpath=[pkg://meds_torch.configs]'

defaults:
  - data: pytorch_dataset
  - model: supervised
  - callbacks: default
  - logger: null
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - experiment: null
  - hparams_search: null
  - optional local: default
  - debug: null
  - _self_      # LAST — so values below override all loaded defaults

seed: 42
name: "train"
train: true      # run trainer.fit()
test: true       # run trainer.test() on held_out after training
task_name: mimic_mortality_in_hospital_24h
tags: ["lane_a", "mimic", "supervised"]

extras:
  enforce_tags: false
  print_config: true

# ---- Paths ------------------------------------------------------------------
paths:
  data_dir: data/triplet_tensors        # already fully preprocessed (tensorization.done)
  meds_cohort_dir: data/MEDS_cohort
  output_dir: experiments/lane_a/results/mimic

# ---- Data -------------------------------------------------------------------
data:
  task_root_dir: data/MEDS_cohort/tasks
  task_name: mortality/in_hospital/first_24h   # matches data/MEDS_cohort/tasks/mortality/in_hospital/first_24h
  max_seq_len: 512                # MIMIC sequences are longer than K-MIMIC's
  dataloader:
    batch_size: 64                # MIMIC is large; larger batch amortises shard IO
    num_workers: 8

# ---- Model ------------------------------------------------------------------
# Same architecture family as K-MIMIC (scaled up) for a fair comparison.
model:
  token_dim: 128
  backbone:
    nheads: 4
    dropout: 0.1
    model:
      attn_layers:
        attn_flash: false   # start false (proven-safe on CPU config); flip to true only after confirming flash-attn is installed on the pod

# ---- Trainer ----------------------------------------------------------------
trainer:
  max_epochs: 20                 # MIMIC has ~300k patients; fewer epochs usually enough
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  deterministic: false
